<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎲</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-300">
    <section class="min-h-screen 
    flex flex-col items-center  bg-gray-100">
  
        <h1 class="text-5xl mb-5 mt-6 ">Dice Roller</h1>   
        <div>
            <label class="text-3xl">Dice Num:</label>
            <input type="number" class="border-solid border-blue-300 border-2">
            <button class="bg-blue-600 text-white 
            font-semibold py-2 px-4 rounded-lg shadow-md 
            transition duration-300 ease-in-out 
            hover:bg-blue-700 hover:shadow-lg 
            active:bg-blue-800 active:scale-95 
            focus:outline-none focus:ring-2 
            focus:ring-blue-300">Roll Dice</button>

        </div>
      
    </section>




    
    <script src="script.js"></script>
</body>
</html>
